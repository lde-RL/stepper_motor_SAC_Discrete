; PlatformIO Project — Pipe Explorer firmware for Teensy 4.1
;
; Build & flash:
;   pio run                  # build only
;   pio run -t upload        # build + flash over USB
;   pio device monitor       # serial monitor (115200)
;
; micro-ROS agent on the PC side:
;   ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyACM0 -b 115200

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200

; micro-ROS + sensor libraries
lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino.git#v2.0.7-humble
    adafruit/Adafruit BNO08x@^1.2.5
    pololu/VL53L0X@^1.3.1

build_flags =
    -D TEENSYDUINO
    ; micro-ROS transport: USB serial (default).  For native Ethernet,
    ; see README and swap set_microros_serial_transports() in main.cpp.

; Teensy 4.1 runs at 600 MHz by default; no override needed.
